name: Build POOLSEC

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET Framework
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build
        shell: cmd
        run: |
          cd ref-cad
          dir
          cd ..
          dotnet restore
          dotnet build -c Release -v minimal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: POOLSEC-x64
          path: bin/Release/net48/POOLSEC.dll
