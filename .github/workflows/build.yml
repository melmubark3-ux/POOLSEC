name: Build POOLSEC.dll

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Verify ref-cad contents
        run: dir ref-cad
        shell: cmd

      - name: Build with MSBuild
        run: msbuild POOLSEC.csproj /p:Configuration=Release /p:Platform=AnyCPU /t:Build /v:minimal
        shell: cmd

      - name: List output files
        run: if exist bin\Release\ (dir bin\Release\ /s) else (echo "bin\Release not found")
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: POOLSEC-x64
          path: bin\Release\POOLSEC.dll
          if-no-files-found: error
